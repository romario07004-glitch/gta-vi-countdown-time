<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA songs</title>
    <style>
        /* تنسيق بسيط لشكل العد التنازلي */
        .countdown-container {
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 20px;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .countdown-timer {
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
        }
    </style>
</head>
<body style="background-image: url(crimes.jfif); background-repeat: no-repeat; background-size: cover; background-position: center;">
    
    <img src="d:\table\Rockstar_logo.webp" width="100">
    <br>
    <br>
    
    <h2>Flower in A Hurricane [from GTA VI]</h2>
    <img src="flower.jpg" width="320">
    <br>
    
    <!-- تم تصحيح إغلاق وسوم الصوت هنا -->
    <audio controls class="audio-player">
        <source src="flower.mp3" type="audio/mpeg">
        <source src="flower.wav" type="audio/wav">
        <source src="flower.ogg" type="audio/ogg">
        متصفحك لا يدعم مشغل الصوت.
    </audio>

    <br>
    <!-- قسم العد التنازلي -->
    <div class="countdown-container">
        <h3>Grand theft auto release date</h3>
        <div id="timer" class="countdown-timer">جاري التحميل...</div>
    </div>

    <script>
        // تاريخ إصدار GTA VI (يمكنك تعديل التاريخ والوقت حسب موعد الإصدار الرسمي)
        // مثال: 19 نوفمبر 2026
        const launchDate = new Date("Nov 19, 2026 00:00:00").getTime();

        const countdownInterval = setInterval(function() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            if (distance < 0) {
                clearInterval(countdownInterval);
                document.getElementById("timer").innerHTML = "تم إطلاق اللعبة بنجاح!";
            } else {
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById("timer").innerHTML = days + " Days" + hours + " hours"
                + minutes + " minutes" + seconds + " seconds";
            }
        }, 1000);

        // كود التحكم في مشغلات الصوت
        const audioPlayers = document.querySelectorAll('.audio-player');

        audioPlayers.forEach(player => {
            player.addEventListener('play', () => {
                audioPlayers.forEach(otherPlayer => {
                    if (otherPlayer !== player) {
                        otherPlayer.pause();
                        otherPlayer.currentTime = 0;
                    }
                });
            });
        });
    </script>
</body>
</html>
